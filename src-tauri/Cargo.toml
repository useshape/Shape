[package]
name = "app"
version = "0.2.8"
description = "Shape — agentic IDE"
authors = ["Shape"]
license = "BUSL-1.1"
repository = "https://github.com/useshape/Shape"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["protocol-asset", "unstable", "devtools", "webview-data-url"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
git2 = "0.19"
regex = "1"
fsindex = "0.3.1"
fst = "0.4.7"
nucleo-matcher = "0.3.1"
tree-sitter = "*"
tree-sitter-javascript = "*"
tree-sitter-typescript = "*"
tree-sitter-json = "*"
tree-sitter-css = "*"
tree-sitter-md = "*"
tree-sitter-html = "*"
tree-sitter-yaml = "*"
tree-sitter-python = "*"
tree-sitter-rust = "*"
tree-sitter-go = "*"
tree-sitter-java = "*"
tree-sitter-c = "*"
tree-sitter-cpp = "*"
tree-sitter-toml-ng = "*"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
dotenvy = "0.15.7"
futures = "0.3.32"
walkdir = "2.5.0"
urlencoding = "2.1.3"
dirs = "5.0.1"
url = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
backoff = { version = "0.4", features = ["tokio"] }
specta = { version = "2.0.0-rc.20", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc.20", features = ["derive"] }
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
trash = "5.2.3"
uuid = { version = "1", features = ["v4"] }
open = "5"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
keyring = "3"
bincode = "1.3"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target."cfg(any(target_os = \"windows\", target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
notify = "8.2.0"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
