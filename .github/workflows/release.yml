name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build runtime
        run: npm run build:runtime

      - name: Test
        run: npm run test:all

      - name: Assert tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "$PKG"

  build:
    name: Build (${{ matrix.os }} ${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x86_64
            target: ""
            bundles: nsis
          - runner: windows-11-arm
            os: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - runner: macos-latest
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin
            bundles: "app,dmg"
          - runner: macos-latest
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin
            bundles: "app,dmg"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.arch }}

      - run: npm ci

      - name: Sync version
        run: npm run sync-version

      - name: Build runtime
        run: npm run build:runtime

      # Password-protected key in secrets (upload via node/fs, not PowerShell pipe —
      # UTF-16 piping corrupts the key and surfaces as "Wrong password").
      - name: Build Tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Official Shape Cloud AI attestation (same secret as website SHAPE_CLOUD_BUILD_SECRET).
          SHAPE_CLOUD_BUILD_SECRET: ${{ secrets.SHAPE_CLOUD_BUILD_SECRET }}
          # Bake production website into Next + Rust (release binaries ignore runtime redirects).
          NEXT_PUBLIC_SHAPE_WEBSITE_URL: https://www.useshape.org
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SHAPE_CLOUD_BUILD_SECRET:-}" ]; then
            echo "SHAPE_CLOUD_BUILD_SECRET secret is required for release builds" >&2
            exit 1
          fi
          if [ "${{ matrix.os }}" = "macos" ]; then
            export MACOSX_DEPLOYMENT_TARGET=12.0
          fi

          KEYCHAIN_PATH=""
          CERT_PATH=""
          SIGNING_JSON=""
          cleanup_signing() {
            if [ -n "$KEYCHAIN_PATH" ]; then
              security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            fi
            if [ -n "$CERT_PATH" ]; then
              rm -f "$CERT_PATH"
            fi
            if [ -n "$SIGNING_JSON" ]; then
              rm -f "$SIGNING_JSON"
            fi
          }
          trap cleanup_signing EXIT

          TAURI_CONFIG_ARGS=()
          if [ "${{ matrix.os }}" = "macos" ] \
            && [ -n "${APPLE_CERTIFICATE:-}" ] \
            && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] \
            && [ -n "${APPLE_SIGNING_IDENTITY:-}" ] \
            && [ -n "${APPLE_ID:-}" ] \
            && [ -n "${APPLE_PASSWORD:-}" ] \
            && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple signing secrets present; importing certificate for this build"
            WORK="${RUNNER_TEMP:-/tmp}"
            KEYCHAIN_PATH="$WORK/shape-signing.keychain-db"
            CERT_PATH="$WORK/shape-cert.p12"
            SIGNING_JSON="$WORK/shape-macos-signing.json"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(String(process.env.APPLE_CERTIFICATE||"").replace(/\s+/g,""), "base64"))' "$CERT_PATH"
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"
            CERT_PATH=""
            node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({bundle:{macOS:{signingIdentity:process.env.APPLE_SIGNING_IDENTITY,hardenedRuntime:true}}}))' "$SIGNING_JSON"
            TAURI_CONFIG_ARGS=(--config "$SIGNING_JSON")
          else
            if [ "${{ matrix.os }}" = "macos" ]; then
              echo "Apple signing secrets absent; leaving signingIdentity unset"
            fi
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi

          if [ -n "${{ matrix.target }}" ]; then
            if [ ${#TAURI_CONFIG_ARGS[@]} -gt 0 ]; then
              npm run tauri -- build --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}" "${TAURI_CONFIG_ARGS[@]}"
            else
              npm run tauri -- build --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"
            fi
          else
            npm run tauri -- build --bundles "${{ matrix.bundles }}"
          fi

      - name: Prepare release assets
        run: node scripts/release/assets.mjs --os ${{ matrix.os }} --arch ${{ matrix.arch }} --out-dir dist/release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      # GitHub artifact attestations require a public repo or a paid org plan.
      # Skip them here — updater .sig files still ship with the release.

      - name: Previous tag
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Detect prerelease
        id: meta
        run: |
          # Stable tags are vX.Y.Z. Nightly tags are hyphenated (vX.Y.Z-nightly) and publish as GitHub prereleases.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate notes
        run: |
          if [ -n "${{ steps.prev.outputs.tag }}" ]; then
            node scripts/release/notes.mjs --from "${{ steps.prev.outputs.tag }}" --to HEAD --output release-notes.md
          else
            node scripts/release/notes.mjs --to HEAD --output release-notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--tag "${GITHUB_REF_NAME}" --dir dist/release --notes-file release-notes.md --publish)
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          # Draft → upload with retries + octet-stream → publish.
          # softprops dies on intermittent uploads.github.com "Error creating policy".
          node scripts/release/upload.mjs "${ARGS[@]}"
